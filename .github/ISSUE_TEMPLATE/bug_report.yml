name: Bug report
description: Something does not work as described in the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste personal data: no real names, email addresses, phone numbers,
        CV text, mail, API keys or tokens. Replace them with example values.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, ideally in the demo workspace (`applysmith demo init`).
      placeholder: |
        1. applysmith serve --workspace ~/Applysmith-Demo
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `applysmith --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and Chrome versions
      placeholder: macOS 15.1, Google Chrome 150
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: applysmith doctor output
      description: Run `applysmith doctor` and paste the result, with personal values removed.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From Settings, Advanced, View logs, or `server.log` in the workspace. Remove personal values.
      render: text
