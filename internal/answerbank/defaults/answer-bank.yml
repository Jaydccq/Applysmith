# Default answer bank.
#
# The product never supplies a fact about the user: every entry that could
# state one ships as a blank placeholder, and the matcher leaves its field for
# the user until an answer is written. Three groups carry a default:
#   - self-identification entries prefer the option that declines to answer
#     (needs_review marks them for the user to confirm or replace);
#   - auto-acknowledge entries have no answer and act only under the rules for
#     legal declarations;
#   - employer-history entries answer Yes or No from the employers list and the
#     profile's work history, never from anything else.
# Ids are stable across releases; every load of a bank gives it, in memory,
# the entries its file lacks and the newer copies of those it has not changed.
