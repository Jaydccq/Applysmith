# The answers the Answer Bank page offers for the shipped choice questions,
# by entry id (answerbank.ShapeOf). Each choice is "Label|variant|variant":
# the label is what the page shows and what a written question gets; the label
# and its variants are the option labels the matcher looks for on a form, best
# first. "decline" is the shipped decline choice with its eight wordings.
# Yes or no questions, dates, links and numbers take their shape from the
# entry's input types and are not listed here. An entry not listed keeps a
# free answer: its forms' options vary too much for one list.
