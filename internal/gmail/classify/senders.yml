# Shipped sender taxonomy: generic, public sender domains only. A user file
# named gmail-senders.yml in the workspace is merged over this one: lists are
# concatenated without duplicates and maps are overlaid, the override winning.
# Domains match themselves and their subdomains.

# Applicant-tracking systems whose mail is trusted as hiring mail.
trusted_ats:
  - greenhouse.io
  - greenhouse-mail.io
  - lever.co
