# Guard exceptions. At most 50 entries. Each entry names one rule, one exact
# file, the exact allowed value and a reason of at least 10 characters. The
# personal-token, retired-name, internal-material, secret and gitleaks rules
# cannot be listed. An entry that suppresses nothing in a run fails the guard.
